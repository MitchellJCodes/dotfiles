# https://docs.noctalia.dev/umbriel/appearance/
[appearance]
prefer_no_csd = true
corner_radius = 20
border_width = 2
outer_border_width = 0
drag_opacity = 0.75

[appearance.blur]
enabled = true
passes = 3
radius = 3
noise = 0.02
saturation = 1.5

[appearance.shadow]
enabled = true
softness = 30
offset_x = 0
offset_y = 5

[overview]
workspace_wallpaper = false
background_blur = false
shortcuts = false

[colors.overview]
background_tint = "#00000000"
workspace_background = "#00000000"

[colors]
shadow = "#00000077"

[hot_corners.top_left]
enabled = true
delay_ms = 0
action = "overview-toggle"

[general]
show_cheatsheet = false
xwayland_native_resolution = true

[environment]
ELECTRON_OZONE_PLATFORM_HINT = "auto"
SDL_VIDEODRIVER = "wayland"
