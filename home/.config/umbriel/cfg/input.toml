# https://docs.noctalia.dev/umbriel/input/
[input.keyboard]
numlock_toggle = true

[input.focus]
follows_mouse = "always"

[input.cursor]
theme = "Bibata-Modern-Ice"
size = 24
follows_focus = true
hardware_cursor = true
hide_when_typing = true

[input.touchpad]
natural_scroll = true
disable_while_typing = true
accel_profile = "adaptive"
