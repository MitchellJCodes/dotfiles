# Syntax: https://docs.noctalia.dev/umbriel/keybinds/
# Actions: https://docs.noctalia.dev/umbriel/actions/
[keybinds]
"Mod+Shift+Slash" = "cheatsheet-toggle"

# Applications and session
"Mod+Return" = { action = "spawn footclient", repeat = false }
"Mod+E" = { action = "spawn nautilus --new-window", repeat = false }
"Mod+B" = { action = "spawn librewolf", repeat = false }
"Mod+Shift+B" = { action = "spawn librewolf -private-window", repeat = false }
"Mod+Q" = { action = "window-close", repeat = false }

"Mod+Space" = { action = "spawn noctalia msg panel-toggle launcher", repeat = false }
"Mod+S" = { action = "spawn noctalia msg panel-toggle control-center", repeat = false }
"Mod+Comma" = { action = "spawn noctalia msg settings-toggle", repeat = false }
"Mod+Ctrl+B" = { action = "spawn noctalia msg bar-toggle", repeat = false }
"Mod+V" = { action = "spawn noctalia msg panel-toggle clipboard", repeat = false }
"Mod+Shift+W" = { action = "spawn noctalia msg panel-toggle wallpaper", repeat = false }
"Mod+Shift+E" = { action = "spawn noctalia msg panel-toggle launcher '/emo '", repeat = false }
"Mod+Ctrl+W" = { action = "spawn noctalia msg wallpaper-random", repeat = false }
"Mod+Ctrl+Q" = { action = "spawn noctalia msg panel-toggle session", repeat = false }
"Mod+D" = { action = "spawn noctalia msg panel-toggle prponkshe/umbriel-displays:panel", repeat = false }
"Alt+Tab" = { action = "spawn noctalia msg window-switcher hold", repeat = false }

# Media controls
"XF86AudioRaiseVolume" = { action = "spawn noctalia msg volume-up", allow_when_inhibited = true }
"XF86AudioLowerVolume" = { action = "spawn noctalia msg volume-down", allow_when_inhibited = true }
"XF86AudioMute" = { action = "spawn noctalia msg volume-mute", allow_when_inhibited = true }

"XF86AudioPlay" = { action = "spawn noctalia msg media toggle", allow_when_inhibited = true }
"XF86AudioNext" = { action = "spawn noctalia msg media next", allow_when_inhibited = true }
"XF86AudioPrev" = { action = "spawn noctalia msg media previous", allow_when_inhibited = true }
"XF86AudioStop" = { action = "spawn noctalia msg media stop", allow_when_inhibited = true }

"XF86MonBrightnessUp" = { action = "spawn noctalia msg brightness-up", allow_when_inhibited = true }
"XF86MonBrightnessDown" = { action = "spawn noctalia msg brightness-down", allow_when_inhibited = true }

"Ctrl+Alt+Delete" = "session-quit"
"Mod+Escape" = { action = "shortcuts-inhibit-toggle", allow_when_inhibited = true, repeat = false }
"Mod+Shift+P" = "dpms-off"

#Focus and movement
"Mod+Left" = { action = "window-focus-or-output-left", repeat = false }
"Mod+Right" = { action = "window-focus-or-output-right", repeat = false }
"Mod+Up" = { action = "window-focus-or-workspace-up", repeat = false }
"Mod+Down" = { action = "window-focus-or-workspace-down", repeat = false }
"Mod+H" = { action = "window-focus-or-output-left", repeat = false }
"Mod+L" = { action = "window-focus-or-output-right", repeat = false }
"Mod+K" = { action = "window-focus-or-workspace-up", repeat = false }
"Mod+J" = { action = "window-focus-or-workspace-down", repeat = false }

"Mod+Shift+Left" = { action = "window-move-or-output-left", repeat = false }
"Mod+Shift+Down" = { action = "window-move-or-workspace-down", repeat = false }
"Mod+Shift+Up" = { action = "window-move-or-workspace-up", repeat = false }
"Mod+Shift+Right" = { action = "window-move-or-output-right", repeat = false }
"Mod+Shift+H" = { action = "window-move-or-output-left", repeat = false }
"Mod+Shift+J" = { action = "window-move-or-workspace-down", repeat = false }
"Mod+Shift+K" = { action = "window-move-or-workspace-up", repeat = false }
"Mod+Shift+L" = { action = "window-move-or-output-right", repeat = false }

"Mod+Shift+Ctrl+Left" = { action = "window-move-to-output-left", repeat = false }
"Mod+Shift+Ctrl+Down" = { action = "window-move-to-output-down", repeat = false }
"Mod+Shift+Ctrl+Up" = { action = "window-move-to-output-up", repeat = false }
"Mod+Shift+Ctrl+Right" = { action = "window-move-to-output-right", repeat = false }
"Mod+Shift+Ctrl+H" = { action = "window-move-to-output-left", repeat = false }
"Mod+Shift+Ctrl+J" = { action = "window-move-to-output-down", repeat = false }
"Mod+Shift+Ctrl+K" = { action = "window-move-to-output-up", repeat = false }
"Mod+Shift+Ctrl+L" = { action = "window-move-to-output-right", repeat = false }

"Mod+Ctrl+Left" = { action = "output-focus-left", repeat = false }
"Mod+Ctrl+Right" = { action = "output-focus-right", repeat = false }
"Mod+Ctrl+Up" = { action = "workspace-previous", repeat = false }
"Mod+Ctrl+Down" = { action = "workspace-next", repeat = false }
"Mod+Ctrl+H" = { action = "output-focus-left", repeat = false }
"Mod+Ctrl+L" = { action = "output-focus-right", repeat = false }
"Mod+Ctrl+K" = { action = "workspace-previous", repeat = false }
"Mod+Ctrl+J" = { action = "workspace-next", repeat = false }

"Mod+Alt+Left"  = { action = "column-focus-tab-previous", repeat = false }
"Mod+Alt+Right" = { action = "column-focus-tab-next", repeat = false }
"Mod+Alt+H"  = { action = "column-focus-tab-previous", repeat = false }
"Mod+Alt+L" = { action = "column-focus-tab-next", repeat = false }

"Mod+Minus" = { action = "window-modify-primary-extent -0.1", repeat = false }
"Mod+Equal" = { action = "window-modify-primary-extent 0.1", repeat = false }
"Mod+Shift+Minus" = { action = "window-modify-secondary-extent -0.1", repeat = false }
"Mod+Shift+Equal" = { action = "window-modify-secondary-extent 0.1", repeat = false }

"Mod+Home" = { action = "column-focus-first", repeat = false }
"Mod+End" = { action = "column-focus-last", repeat = false }
"Mod+Ctrl+Home" = { action = "column-move-to-first", repeat = false }
"Mod+Ctrl+End" = { action = "column-move-to-last", repeat = false }

# Window state and layout
"Mod+T" = { action = "window-toggle-floating", repeat = false }
"Mod+Shift+T" = { action = "window-focus-switch-floating", repeat = false }
"Mod+P" = { action = "window-toggle-pinned", repeat = false }
"Mod+M" = { action = "window-toggle-maximize-to-edges", repeat = false }
"Mod+F" = { action = "window-toggle-maximize", repeat = false }
"Mod+Shift+F" = { action = "window-toggle-fullscreen", repeat = false }
"Mod+Ctrl+F" = { action = "window-toggle-maximize", repeat = false }

"Mod+R" = { action = "window-cycle-primary-extent", repeat = false }
"Mod+Shift+R" = { action = "window-cycle-primary-extent-back", repeat = false }
"Mod+Ctrl+R" = { action = "window-cycle-secondary-extent", repeat = false }
"Mod+Ctrl+Shift+R" = { action = "window-cycle-secondary-extent-back", repeat = false }
"Mod+BracketLeft" = { action = "window-consume-or-expel-left", repeat = false }
"Mod+BracketRight" = { action = "window-consume-or-expel-right", repeat = false }
"Mod+WheelUp"   = { action = "workspace-previous", cooldown_ms = 150 }
"Mod+WheelDown" = { action = "workspace-next", cooldown_ms = 150 }
"Mod+Ctrl+WheelUp" = "window-focus-right"
"Mod+Ctrl+WheelDown"  = "window-focus-left"
"Mod+Shift+WheelUp" = { action = "window-move-or-workspace-up", cooldown_ms = 150 }
"Mod+Shift+WheelDown" = { action = "window-move-or-workspace-down", cooldown_ms = 150 }
"Mod+Tab" = { action = "overview-toggle", repeat = false }
"Mod+W" = { action = "workspace-set-layout toggle", repeat = false }
"Mod+Alt+W" = { action = "column-toggle-tabbed", repeat = false }
"Mod+C" = { action = "window-center", repeat = false }

# Workspaces
"Mod+1" = { action = "workspace-switch 1", repeat = false}
"Mod+2" = { action = "workspace-switch 2", repeat = false}
"Mod+3" = { action = "workspace-switch 3", repeat = false}
"Mod+4" = { action = "workspace-switch 4", repeat = false}
"Mod+5" = { action = "workspace-switch 5", repeat = false}
"Mod+6" = { action = "workspace-switch 6", repeat = false}
"Mod+7" = { action = "workspace-switch 7", repeat = false}
"Mod+8" = { action = "workspace-switch 8", repeat = false}
"Mod+9" = { action = "workspace-switch 9", repeat = false}
"Mod+0" = { action = "workspace-switch 10", repeat = false}
"Mod+Shift+1" = { action = "window-move-to-workspace 1", repeat = false}
"Mod+Shift+2" = { action = "window-move-to-workspace 2", repeat = false}
"Mod+Shift+3" = { action = "window-move-to-workspace 3", repeat = false}
"Mod+Shift+4" = { action = "window-move-to-workspace 4", repeat = false}
"Mod+Shift+5" = { action = "window-move-to-workspace 5", repeat = false}
"Mod+Shift+6" = { action = "window-move-to-workspace 6", repeat = false}
"Mod+Shift+7" = { action = "window-move-to-workspace 7", repeat = false}
"Mod+Shift+8" = { action = "window-move-to-workspace 8", repeat = false}
"Mod+Shift+9" = { action = "window-move-to-workspace 9", repeat = false}
"Mod+Shift+0" = { action = "window-move-to-workspace 10", repeat = false}

# Scratchpad
"Mod+Shift+N" = { action = "window-move-to-scratchpad", repeat = false }
"Mod+N" = "scratchpad-toggle"
"Mod+Ctrl+N" = { action = "window-restore-from-scratchpad", repeat = false }
"Mod+Alt+N" = "scratchpad-focus-next"

# Screenshots
"Print" = "spawn noctalia msg screenshot-region"
"Ctrl+Shift+1" = "spawn noctalia msg screenshot-region"
"Ctrl+Shift+2" = "spawn noctalia msg screenshot-fullscreen pick"
